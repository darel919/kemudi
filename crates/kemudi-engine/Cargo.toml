[package]
name = "kemudi-engine"
version = "0.0.1"
edition = "2021"
description = "WASM vehicle simulation engine for Kemudi.js"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nalgebra = { version = "0.32", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

