name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rokit
        uses: rojo-rbx/rokit-action@v1

      - name: Run fixture suite
        run: lune run test/fixture_runner.luau

      - name: Run vehicle unit tests
        run: lune run test/vehicle_unit_test.luau

      - name: Run module compat tests
        run: lune run test/module_compat_test.luau

      - name: Run physics integration tests
        run: lune run test/physics_integration_test.luau

      - name: Run chassis tests
        run: lune run test/chassis_test.luau

      - name: Run TCM tests
        run: lune run test/tcm_test.luau

      - name: Run gravity fixture test
        run: lune run test/gravity_fixture_test.luau

      - name: Run ground zero grid test
        run: lune run test/ground_zero_grid_test.luau

      - name: Run client HUD visibility test
        run: lune run test/client_hud_visibility_test.luau

      - name: Run static collision regression test
        run: lune run test/static_collision_regression_test.luau
